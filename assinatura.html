  <main class="container">
    <h1>Faça sua Assinatura</h1>
    <p class="sub">Responda as perguntas abaixo e receba recomendações personalizadas.</p>

    <form class="form">
      <label>Quantas pessoas moram na sua residência?</label>
      <select>
        <option>1</option>
        <option>2</option>
        <option>3+</option>
      </select>

      <label>Você possui energia solar?</label>
      <select>
        <option>Sim</option>
        <option>Não</option>
      </select>

      <label>Com que frequência você utiliza o ar-condicionado?</label>
      <select>
        <option>Frequente (diariamente)</option>
        <option>Ocasional (fins de semana)</option>
        <option>Raro</option>
      </select>

      <label>Costuma reaproveitar água (chuva, máquina de lavar)?</label>
      <select>
        <option>Sim</option>
        <option>Não</option>
      </select>

      <label>Você costuma monitorar o consumo de energia ou água por aplicativo ou dispositivo inteligente?</label>
      <select>
        <option>Sim</option>
        <option>Não</option>
      </select>

      <button type="submit" class="btn" href="planos.html">Gerar Plano</button>
      <li><a class="dropdown-item" href="planos.html">Gerar Plano</a></li>
