<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
    <link rel="stylesheet" href="perfil.css">
</head>
<body>

<header><h2>Perfil</h2></header>

<div class="perfil-img-container">
  <img id="profile-img" src="https://i.pinimg.com/736x/c1/f3/31/c1f3317f44a0d83c43e769892e4d3473.jpg" alt="perfil-img" />
   
<label for="upload-input" class="camera-btn">
    <img src="https://thumbs.dreamstime.com/b/%C3%ADcone-do-vetor-da-c%C3%A2mera-isolado-no-fundo-preto-92672166.jpg" alt="Camera Icon" width="20" height="20" />
  </label>
  <input type="file" id="upload-input" accept="image/*" />
</div> 

<div class="forms.compt">


    <form>
  <div class="form-group">
    <label for="nome">Nome</label>
    <input type="text" id="nome" value="Luiza">
  </div>

  <div class="form-group">
    <label for="sobrenome">Sobrenome</label>
    <input type="text" id="sobrenome" value="Costa">
  </div>

  <div class="form-group full">
    <label for="email">E-mail</label>
    <input type="email" id="email" value="luizacosta0102@gmail.com">
  </div>

  <div class="form-group full">
    <label>Qual é a sua tipologia residencial?</label>
    <button class="mais">+</button>
  </div>

  <div class="form-group full">
    <label>Qual a tipologia da sua região</label>
    <button class="mais">+</button>
  </div>

  <div class="form-group">
    <label for="telefone">Telefone</label>
    <input type="text" id="telefone" value="(81) 9 9999-9999">
  </div>

  <div class="form-group">
    <label for="senha">Senha</label>
    <input type="password" id="senha" value="******">
  </div>

  <div class="form-group full">
    <label for="confirmar">Confirmar senha</label>
    <input type="password" id="confirmar" value="******">
  </div>

  <div class="btn-container">
    <button type="button">Editar</button>
    <button type="submit">Salvar</button>
  </div>
</form>

</div>


    <div class="mensagem">
        
    </div>
</div>

</html>
